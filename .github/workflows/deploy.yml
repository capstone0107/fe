name: Deploy React App

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4
    
    # 2. Node.js 설정
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # 사용하는 Node 버전으로 변경
        cache: 'npm'
    
    # 3. 의존성 설치
    - name: Install dependencies
      run: npm install
    
    # 4. 빌드
    - name: Build
      run: npm run build
      env:
        CI: false  # Warning을 에러로 취급하지 않음
    
    # 5. 서버에 배포
    - name: Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "build/*"
        target: "/tmp/react-build"
        strip_components: 1
    
    # 6. 파일 이동 및 권한 설정
    - name: Move files and set permissions
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo rm -rf /var/www/react-app/*
          sudo mv /tmp/react-build/* /var/www/react-app/
          sudo chown -R www-data:www-data /var/www/react-app
          sudo chmod -R 755 /var/www/react-app
          sudo systemctl reload nginx
          rm -rf /tmp/react-build
    
    # 7. 배포 완료 알림
    - name: Deployment complete
      run: |
        echo "✅ Deployment completed successfully!"
        echo "🌐 URL: http://13.125.207.25"
